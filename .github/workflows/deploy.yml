name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ciukldoxjmzwnmpeulob
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CLI מ-npm (לא דרך GitHub API, שמגביל בקשות לשרתים המשותפים)
      - name: Deploy telegram-bot
        run: npx -y supabase@latest functions deploy telegram-bot --project-ref $PROJECT_REF --no-verify-jwt --use-api --yes
      - name: Deploy legal
        run: npx -y supabase@latest functions deploy legal --project-ref $PROJECT_REF --no-verify-jwt --use-api --yes
      - name: Register Telegram webhook
        run: curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/telegram-bot?action=setup"
